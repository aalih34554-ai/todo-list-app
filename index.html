<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>📋 My To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <select id="categorySelect" class="category-select">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="shopping">Shopping</option>
                        <option value="health">Health</option>
                        <option value="other">Other</option>
                    </select>
                    <button id="addBtn" class="add-btn">Add Task</button>
                </div>
                <div class="input-actions">
                    <button id="clearCompletedBtn" class="action-btn clear-btn">Clear Completed</button>
                    <button id="sortBtn" class="action-btn sort-btn">Sort by Priority</button>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat">
                    <span class="stat-value" id="totalTasks">0</span>
                    <span class="stat-label">Total Tasks</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="completedTasks">0</span>
                    <span class="stat-label">Completed</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="remainingTasks">0</span>
                    <span class="stat-label">Remaining</span>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="personal">Personal</button>
                <button class="filter-btn" data-filter="work">Work</button>
                <button class="filter-btn" data-filter="shopping">Shopping</button>
                <button class="filter-btn" data-filter="health">Health</button>
            </div>

            <!-- Tasks List -->
            <div class="tasks-section">
                <ul id="taskList" class="task-list" data-empty="true">
                    <li class="empty-state">
                        <p>✨ No tasks yet. Add one to get started!</p>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
